{% set version = "0.4.1" %}
{% set python_min = "3.10" %}

package:
  name: ncplot
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/ncplot/ncplot-{{ version }}.tar.gz
  sha256: 4b31b8e6234448e4fce94d5d6ac07f28ebd0dd4c9f1244fc093e9175a0294dba

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-git
  run:
    - python >={{ python_min }}
    - panel
    - netcdf4
    - hvplot
    - metpy
    - holoviews
    - bokeh
    - xarray
    - geoviews >=1.10.0
    - jupyter_bokeh >=3.0.7

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - ncplot
  commands:
    - pip check

about:
  home: https://github.com/pmlmodelling/ncplot
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Easy interactive viewing of NetCDF files in Python

extra:
  recipe-maintainers:
    - robertjwilson
